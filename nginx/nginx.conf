server {
    listen 80;
    server_name _;

    # Здесь лежит статика из volume (его монтирует docker-compose)
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: любой путь, которого нет как файла,
    # отдаём как index.html — чтобы React Router работал
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем запросы к API на бэкенд.
    # "backend" — это ИМЯ СЕРВИСА в docker-compose.
    # Docker DNS автоматически резолвит его в IP контейнера.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксируем запросы к контенту (постеры, картинки)
    location /content/ {
        proxy_pass http://backend:3000/content/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}