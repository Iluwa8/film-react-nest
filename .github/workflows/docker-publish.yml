name: Build and publish Docker images

on:
  push:
    branches: [review] # Пока оставляем review, чтобы протестировать. Потом поменяем на main.

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./backend
            image: film-react-nest-backend
          - context: ./frontend
            image: film-react-nest-frontend
          - context: ./nginx
            image: film-react-nest-nginx
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          # ВОТ ЗДЕСЬ ИСПРАВЛЕНИЕ: заменили переменную на iluwa8 (маленькими буквами)
          tags: ghcr.io/iluwa8/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max